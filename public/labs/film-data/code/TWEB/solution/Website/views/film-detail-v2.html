<!DOCTYPE html>
<!-- Film detail template with reviews and live chat. -->
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, shrink-to-fit=no">
    <title>Film Details</title>
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.1/dist/css/bootstrap.min.css" rel="stylesheet" 
          integrity="sha384-+0n0xVW2eSR5OomGNYDnhzAbDsOXxcvSN1TPprVMTNDbiYZCxYbOOl7+AMvyTG2x" 
          crossorigin="anonymous">
    
    <style>
        body {
            background-color: #1a1a1a;
            color: #e0e0e0;
        }
        
        .navbar {
            background-color: #0d0d0d !important;
        }
        
        .container-main {
            margin-top: 80px;
            padding: 40px 20px;
        }
        
        .film-poster {
            object-fit: cover;
            border-radius: 10px;
        }
        
        .film-info {
            background-color: #2a2a2a;
            padding: 30px;
            border-radius: 10px;
        }
        
        .film-title {
            font-size: 2.5em;
            font-weight: bold;
            color: #ffffff;
            margin-bottom: 30px;
        }
        
        .info-label {
            font-weight: bold;
            color: #ffb81c;
            font-size: 1.1em;
        }
        
        .info-value {
            color: #e0e0e0;
            margin-top: 8px;
            margin-bottom: 20px;
            line-height: 1.6;
        }
        
        .rating {
            font-size: 1.3em;
            color: #ffb81c;
            margin-bottom: 20px;
        }
        
        .back-button {
            background-color: #ffb81c;
            color: #000;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
            margin-bottom: 30px;
        }
        
        .back-button:hover {
            background-color: #ff8c00;
        }
        
        .loading {
            text-align: center;
            padding: 40px;
            font-size: 1.2em;
            color: #ffb81c;
        }
        
        .error {
            background-color: #d32f2f;
            color: white;
            padding: 20px;
            border-radius: 5px;
            margin: 20px 0;
        }
        
        .tag {
            display: inline-block;
            background-color: #ffb81c;
            color: #000;
            padding: 5px 10px;
            border-radius: 20px;
            margin-right: 10px;
            margin-bottom: 10px;
            font-size: 0.9em;
            font-weight: bold;
        }
        
        .reviews-section {
            background-color: #2a2a2a;
            padding: 30px;
            border-radius: 10px;
            margin-top: 50px;
        }
        
        .reviews-section h2 {
            color: #ffffff;
            margin-bottom: 30px;
        }
        
        .review-item {
            background-color: #1a1a1a;
            padding: 20px;
            margin-bottom: 15px;
            border-left: 4px solid #ffb81c;
            border-radius: 5px;
        }
        
        .review-rating {
            color: #ffb81c;
            font-weight: bold;
            margin-bottom: 10px;
        }
        
        .review-text {
            color: #e0e0e0;
            margin-bottom: 10px;
            line-height: 1.6;
        }
        
        .review-author {
            color: #999;
            font-size: 0.9em;
        }
        
        /* Chat Styles */
        .chat-container {
            background-color: #2a2a2a;
            border-radius: 10px;
            padding: 20px;
            margin-top: 30px;
        }
        
        .chat-header {
            color: #ffffff;
            font-size: 1.5em;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .active-users {
            font-size: 0.8em;
            color: #ffb81c;
        }
        
        .username-prompt {
            background-color: #1a1a1a;
            padding: 30px;
            border-radius: 10px;
            text-align: center;
        }
        
        .username-prompt h3 {
            color: #ffffff;
            margin-bottom: 20px;
        }
        
        .username-prompt input {
            background-color: #2a2a2a;
            border: 2px solid #ffb81c;
            color: #ffffff;
            padding: 10px 15px;
            border-radius: 5px;
            width: 300px;
            max-width: 100%;
            margin-bottom: 15px;
        }
        
        .username-prompt input:focus {
            outline: none;
            border-color: #ff8c00;
        }
        
        .username-prompt button {
            background-color: #ffb81c;
            color: #000;
            border: none;
            padding: 10px 30px;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
        }
        
        .username-prompt button:hover {
            background-color: #ff8c00;
        }
        
        .chat-messages {
            background-color: #1a1a1a;
            height: 400px;
            overflow-y: auto;
            padding: 20px;
            border-radius: 5px;
            margin-bottom: 15px;
        }
        
        .chat-message {
            margin-bottom: 8px;
            padding: 4px;
            background-color: #2a2a2a;
            border-radius: 5px;
            border-left: 3px solid #ffb81c;
        }
        
        .chat-message.system {
            border-left-color: #999;
            background-color: #1a1a1a;
            font-style: italic;
            color: #999;
        }
        
        .message-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 5px;
        }
        
        .message-username {
            color: #ffb81c;
            font-weight: bold;
        }
        
        .message-time {
            color: #999;
            font-size: 0.85em;
        }
        
        .message-text {
            line-height: 15px;
            font-size: small;
            color: #e0e0e0;
            word-wrap: break-word;
        }
        
        .typing-indicator {
            color: #999;
            font-style: italic;
            font-size: 0.9em;
            padding: 10px;
            height: 30px;
        }
        
        .chat-input-container {
            display: flex;
            gap: 10px;
        }
        
        .chat-input {
            flex: 1;
            background-color: #1a1a1a;
            border: 2px solid #ffb81c;
            color: #ffffff;
            padding: 12px 15px;
            border-radius: 5px;
        }
        
        .chat-input:focus {
            outline: none;
            border-color: #ff8c00;
        }
        
        .chat-send-btn {
            background-color: #ffb81c;
            color: #000;
            border: none;
            padding: 12px 25px;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
        }
        
        .chat-send-btn:hover {
            background-color: #ff8c00;
        }
        
        .chat-send-btn:disabled {
            background-color: #666;
            cursor: not-allowed;
        }
    </style>
</head>
<body>
<!-- Top navigation bar -->
<nav class="navbar fixed-top navbar-expand-sm navbar-dark bg-dark">
    <div class="container-fluid">
        <a class="navbar-brand" href="/" style="width: 5%">
            <img src="images/Cipolla.png" alt="Logo" class="img-fluid">
        </a>
        <img src="images/navbarOnion.png" alt="Onion" style="height: 55px; margin-left: 15px;">
        <button class="navbar-toggler" type="button" 
                data-bs-toggle="collapse" 
                data-bs-target="#navbarSupportedContent" 
                aria-controls="navbarSupportedContent" 
                aria-expanded="false" 
                aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarSupportedContent">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
            </ul>
        </div>
    </div>
</nav>

<!-- Film content container -->
<div class="container container-main">
    <button class="back-button" onclick="window.history.back()">← Back</button>
    
    <div id="loading" class="loading">Loading film details...</div>
    <div id="error" class="error" style="display: none;"></div>
    
    <div id="filmContent" style="display: none;">
        <!-- Film Details -->
        <div class="row mb-5">
            <div class="col-md-4">
                <img id="filmPoster" src="" alt="Film Poster" class="film-poster w-100">
                
                <!-- Chat Section under poster -->
                <div class="chat-container">
                    <div class="chat-header">
                        <span>Live Chat</span>
                        <span class="active-users" id="activeUsersCount">0 users online</span>
                    </div>
                    
                    <!-- Username prompt (shown initially) -->
                    <div id="usernamePrompt" class="username-prompt">
                        <h3>Join the conversation</h3>
                        <p style="color: #999; margin-bottom: 20px;">Enter your username to start chatting</p>
                        <input type="text" id="usernameInput" placeholder="Your username" maxlength="20">
                        <br>
                        <button id="joinChatBtn">Join Chat</button>
                    </div>
                    
                    <!-- Chat interface (hidden initially) -->
                    <div id="chatInterface" style="display: none;">
                        <div class="chat-messages" id="chatMessages"></div>
                        <div class="typing-indicator" id="typingIndicator"></div>
                        <div class="chat-input-container">
                            <input type="text" id="messageInput" class="chat-input" placeholder="Type your message..." maxlength="500">
                            <button id="sendMessageBtn" class="chat-send-btn">Send</button>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-md-8">
                <div class="film-info">
                    <h1 class="film-title" id="filmTitle"></h1>
                    
                    <div class="info-label">Release Year</div>
                    <div class="info-value" id="filmYear"></div>
                    
                    <div class="info-label">Rating</div>
                    <div class="rating" id="filmRating"></div>
                    
                    <div class="info-label">Genres</div>
                    <div class="info-value" id="filmGenres"></div>
                    
                    <div class="info-label">Description</div>
                    <div class="info-value" id="filmDescription"></div>
                    
                    <div class="info-label">Duration</div>
                    <div class="info-value" id="filmDuration"></div>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Reviews Section -->
    <div id="reviewsSection" class="reviews-section" style="display: none;">
        <h2>User Reviews <span style="color: #ffb81c;">(<span id="reviewCount">0</span> total)</span></h2>
        <div id="reviewsList"></div>
    </div>
</div>

<!-- Page scripts -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.1/dist/js/bootstrap.bundle.min.js" 
        integrity="sha384-gtEjrD/SeCtmISkJkNUaaKMoLD0//ElJ19smozuHV6z3Iehds+3Ulb9Bn9Plx0x4" 
        crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
<script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
<script src="javascripts/film-detail.js"></script>
</body>
</html>
