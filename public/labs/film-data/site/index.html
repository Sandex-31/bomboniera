<!DOCTYPE html>
<!-- Home page template: navigation, carousel, and sliders. -->
<html lang="en">
<head><script src="shim.js"></script>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, shrink-to-fit=no">
    <title>Rotten Onion</title>
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.1/dist/css/bootstrap.min.css" rel="stylesheet" 
          integrity="sha384-+0n0xVW2eSR5OomGNYDnhzAbDsOXxcvSN1TPprVMTNDbiYZCxYbOOl7+AMvyTG2x" 
          crossorigin="anonymous">
    
    <!-- CSS -->
    <link rel="stylesheet" href="stylesheets/style.css">
    <link rel="stylesheet" href="stylesheets/sliderStyle.css">
    
    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.1/dist/js/bootstrap.bundle.min.js" 
            integrity="sha384-gtEjrD/SeCtmISkJkNUaaKMoLD0//ElJ19smozuHV6z3Iehds+3Ulb9Bn9Plx0x4" 
            crossorigin="anonymous" defer></script>
    <script src="javascripts/index.js" defer></script>
    
    <script type="module" src="javascripts/index.js"></script>
</head>
<body>
<!-- Top navigation bar with search form -->
<nav class="navbar fixed-top navbar-expand-sm navbar-dark bg-dark">
    <div class="container-fluid">
        <a class="navbar-brand" href="index.html" style="width: 5%">
            <img src="images/Cipolla.png" alt="Logo" class="img-fluid">
        </a>
        <img src="images/navbarOnion.png" alt="Onion" style="height: 55px; margin-left: 15px;">
        <button class="navbar-toggler" type="button" 
                data-bs-toggle="collapse" 
                data-bs-target="#navbarSupportedContent" 
                aria-controls="navbarSupportedContent" 
                aria-expanded="false" 
                aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarSupportedContent">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0"> </ul>
            <!-- Search Bar Tematica -->
            <form class="search-form" action="search.html" method="GET" onsubmit="return validateSearch()">
                <div class="search-input-wrapper">
                    <input class="search-input" 
                           type="search" 
                           placeholder="Cerca film (min 3 caratteri)..." 
                           aria-label="Search movies"
                           name="q"
                           minlength="3"
                           required>
                    <button class="search-button" type="submit">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="11" cy="11" r="8"></circle>
                            <path d="m21 21-4.35-4.35"></path>
                        </svg>
                    </button>
                </div>
            </form>
        </div>
    </div>
</nav>
<!-- Main carousel -->
<div class="contenitore" style="padding-top: 4%;">
    <div class="caroselli mx-auto">
        <div id="carouselExampleControls" class="carousel slide" data-bs-ride="carousel" data-bs-interval="4000">
            <div class="carousel-inner">
                <div class="carousel-item active">
                    <button class="custom-card-bg"></button>
                </div>
                <div class="carousel-item">
                    <button class="custom-card-bg"></button>
                </div>
                <div class="carousel-item">
                    <button class="custom-card-bg"></button>
                </div>
            </div>
            <button class="carousel-control-prev" type="button" data-bs-target="#carouselExampleControls" data-bs-slide="prev">
                <span class="carousel-control-prev-icon" aria-hidden="true"></span>
                <span class="visually-hidden">Previous</span>
            </button>
            <button class="carousel-control-next" type="button" data-bs-target="#carouselExampleControls" data-bs-slide="next">
                <span class="carousel-control-next-icon" aria-hidden="true"></span>
                <span class="visually-hidden">Next</span>
            </button>
        </div>
    </div>
</div>
<!-- Slider: Best Movies -->
<div class="slider-container">
    <h2>Best Movies</h2>
    <hr>
    <div class="slider" id="topMoviesSlider"></div>
    <button class="arrow left">&#10094;</button>
    <button class="arrow right">&#10095;</button>
</div>

<!-- Slider: Horror Movies -->
<div class="slider-container">
    <h2>Horror Movies</h2>
    <hr>
    <div class="slider" id="horrorMoviesSlider"></div>
    <button class="arrow left">&#10094;</button>
    <button class="arrow right">&#10095;</button>
</div>

<!-- Scripts -->
<script>
// Validate search input before submitting
function validateSearch() {
    const searchInput = document.querySelector('.search-input');
    const searchTerm = searchInput.value.trim();
    
    if (searchTerm.length < 3) {
        showSearchError('Inserisci almeno 3 caratteri per cercare');
        return false;
    }
    
    return true;
}

// Render a themed error message below the search bar
function showSearchError(message) {
    // Rimuovi messaggi precedenti
    const existingError = document.querySelector('.search-error');
    if (existingError) {
        existingError.remove();
    }
    
    // Crea messaggio di errore tematico
    const errorDiv = document.createElement('div');
    errorDiv.className = 'search-error';
    errorDiv.innerHTML = `
        <div class="search-error-content">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="12" r="10"></circle>
                <line x1="12" y1="8" x2="12" y2="12"></line>
                <line x1="12" y1="16" x2="12.01" y2="16"></line>
            </svg>
            <span>${message}</span>
        </div>
    `;
    
    errorDiv.style.cssText = `
        position: absolute;
        top: calc(100% + 8px);
        left: 50%;
        transform: translateX(-50%);
        background: linear-gradient(135deg, rgba(139, 71, 137, 0.95), rgba(153, 50, 204, 0.95));
        color: white;
        padding: 12px 20px;
        border-radius: 25px;
        font-size: 13px;
        font-weight: 500;
        text-align: center;
        z-index: 1000;
        min-width: 280px;
        box-shadow: 0 8px 32px rgba(128, 0, 128, 0.4);
        border: 1px solid rgba(255, 255, 255, 0.2);
        backdrop-filter: blur(10px);
        animation: slideDown 0.3s ease-out, glow 2s ease-in-out infinite;
    `;
    
    // Aggiungi animazioni CSS
    const style = document.createElement('style');
    style.textContent = `
        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateX(-50%) translateY(-10px) scale(0.9);
            }
            to {
                opacity: 1;
                transform: translateX(-50%) translateY(0) scale(1);
            }
        }
        
        @keyframes glow {
            0%, 100% {
                box-shadow: 0 8px 32px rgba(128, 0, 128, 0.4);
            }
            50% {
                box-shadow: 0 8px 40px rgba(128, 0, 128, 0.6);
            }
        }
        
        .search-error-content {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        
        .search-error-content svg {
            flex-shrink: 0;
            animation: pulse 1.5s ease-in-out infinite;
        }
        
        @keyframes pulse {
            0%, 100% {
                opacity: 1;
            }
            50% {
                opacity: 0.7;
            }
        }
    `;
    
    if (!document.querySelector('#search-error-styles')) {
        style.id = 'search-error-styles';
        document.head.appendChild(style);
    }
    
    // Aggiungi al wrapper della search bar
    const searchWrapper = document.querySelector('.search-input-wrapper');
    searchWrapper.style.position = 'relative';
    searchWrapper.appendChild(errorDiv);
    
    // Rimuovi dopo 4 secondi con animazione
    setTimeout(() => {
        errorDiv.style.animation = 'slideDown 0.3s ease-out reverse';
        setTimeout(() => {
            errorDiv.remove();
        }, 300);
    }, 4000);
}
</script>
<script src="javascripts/javaCards.js"></script>
<script src="javascripts/sliderScript.js"></script>
</body>
</html>
